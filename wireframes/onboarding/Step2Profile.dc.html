<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    .screen { font-family: 'Gaegu', cursive, sans-serif; color: #2b2b2b; line-height: 1.25; }
    a { color: #2b2b2b; text-decoration: underline; }
    a:hover { color: #555; }
    .field-box { border: 2px solid #2b2b2b; border-radius: 10px; padding: 13px 14px; font-size: 14px; min-height: 44px; display: flex; align-items: center; }
    .label { font-size: 13px; color: #5a5a5a; margin-bottom: 6px; display: block; }
  </style>
</helmet>
<div class="screen" style="width:390px;height:844px;background:#f7f5f0;box-sizing:border-box;padding:32px 24px;display:flex;flex-direction:column;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:14px;margin-bottom:26px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#2b2b2b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="display:flex;gap:6px;flex:1;">
      <div style="height:6px;flex:1;background:#2b2b2b;border-radius:3px;"></div>
      <div style="height:6px;flex:1;background:#2b2b2b;border-radius:3px;"></div>
      <div style="height:6px;flex:1;background:#ddd8cd;border-radius:3px;"></div>
      <div style="height:6px;flex:1;background:#ddd8cd;border-radius:3px;"></div>
    </div>
    <div style="font-size:14px;color:#8a8a8a;white-space:nowrap;">2 / 4</div>
  </div>

  <h1 style="font-size:26px;margin:0 0 4px;">프로필을 알려주세요</h1>
  <p style="font-size:14px;color:#8a8a8a;margin:0 0 16px;">일주 계산과 커뮤니티 뱃지에 쓰여요</p>

  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px;">
    <div style="position:relative;width:84px;height:84px;">
      <svg width="84" height="84" viewBox="0 0 84 84" fill="none">
        <circle cx="42" cy="42" r="40" stroke="#b8b0a0" stroke-width="2" stroke-dasharray="4 5"/>
        <circle cx="42" cy="34" r="13" stroke="#b8b0a0" stroke-width="2"/>
        <path d="M16 72c5-16 19-23 26-23s21 7 26 23" stroke="#b8b0a0" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div style="position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:#2b2b2b;display:flex;align-items:center;justify-content:center;border:2px solid #f7f5f0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div style="font-size:13px;color:#8a8a8a;margin-top:8px;">프로필 사진 추가 <span style="color:#b8b0a0;">(선택)</span></div>
  </div>

  <span class="label">닉네임</span>
  <div class="field-box" style="margin-bottom:16px;color:#aaa;">닉네임 입력</div>

  <span class="label">성별</span>
  <div style="display:flex;gap:10px;margin-bottom:16px;">
    <div style="flex:1;text-align:center;padding:13px 0;border-radius:10px;border:2px solid #2b2b2b;background:#2b2b2b;color:#fff;font-size:14px;">여성</div>
    <div style="flex:1;text-align:center;padding:13px 0;border-radius:10px;border:2px solid #2b2b2b;color:#2b2b2b;font-size:14px;">남성</div>
  </div>

  <span class="label">생년월일</span>
  <div style="display:flex;gap:8px;margin-bottom:16px;">
    <div class="field-box" style="flex:1.3;color:#aaa;justify-content:center;">YYYY</div>
    <div class="field-box" style="flex:1;color:#aaa;justify-content:center;">MM</div>
    <div class="field-box" style="flex:1;color:#aaa;justify-content:center;">DD</div>
  </div>

  <span class="label">태어난 시간 <span style="color:#aaa;">(선택하면 정확도 향상)</span></span>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
    <div class="field-box" style="flex:1;color:#aaa;justify-content:center;">HH</div>
    <div class="field-box" style="flex:1;color:#aaa;justify-content:center;">MM</div>
    <div style="border:2px dashed #b8b0a0;border-radius:10px;padding:13px 12px;font-size:13px;color:#8a8a8a;white-space:nowrap;">시간 모름</div>
  </div>
  <div style="font-size:12px;color:#8a8a8a;margin-bottom:14px;">시간을 모르면 일주 정확도가 다소 낮아질 수 있어요</div>

  <div style="flex:1;"></div>

  <div style="background:#2b2b2b;color:#fff;text-align:center;padding:16px;border-radius:10px;font-size:16px;">다음</div>
</div>
</x-dc>
</body>
</html>
